<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* Todo 任务页重设计 —— 暗夜蓝主题（对齐 Qt 端 midnight 主题） */
:root {
  --todo-background: #1a1d21;
  --todo-foreground: #e6e6e6;
  --todo-muted: #9aa4b0;
  --todo-muted-foreground: #9aa4b0;
  --todo-card: #22262c;
  --todo-card-foreground: #e6e6e6;
  --todo-primary: #4c8bf5;
  --todo-primary-foreground: #ffffff;
  --todo-border: #343a44;
  --todo-input: #2a2f37;
  --todo-ring: #4c8bf5;
  --todo-popover: #2a2f37;
  --todo-popover-foreground: #e6e6e6;
  --todo-accent: #4c8bf5;
  --todo-accent-foreground: #ffffff;
  --todo-destructive: #e5534b;
  --todo-destructive-foreground: #ffffff;
  --todo-success: #3fb950;
  --todo-warning: #d29922;

  /* radius scale */
  --todo-radius-sm: 6px;
  --todo-radius-md: 8px;
  --todo-radius-lg: 12px;
  --todo-radius-xl: 16px;

  /* font */
  --todo-font-sans: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--todo-background);
    --color-foreground: var(--todo-foreground);
    --color-card: var(--todo-card);
    --color-card-foreground: var(--todo-card-foreground);
    --color-popover: var(--todo-popover);
    --color-popover-foreground: var(--todo-popover-foreground);
    --color-primary: var(--todo-primary);
    --color-primary-foreground: var(--todo-primary-foreground);
    --color-muted: var(--todo-muted);
    --color-muted-foreground: var(--todo-muted-foreground);
    --color-accent: var(--todo-accent);
    --color-accent-foreground: var(--todo-accent-foreground);
    --color-destructive: var(--todo-destructive);
    --color-destructive-foreground: var(--todo-destructive-foreground);
    --color-border: var(--todo-border);
    --color-input: var(--todo-input);
    --color-ring: var(--todo-ring);
    --radius-sm: var(--todo-radius-sm);
    --radius-md: var(--todo-radius-md);
    --radius-lg: var(--todo-radius-lg);
    --radius-xl: var(--todo-radius-xl);
  }
  @layer base {
    body { background: var(--todo-background); color: var(--todo-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
